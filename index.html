.ai-footer > p:only-child {

.ai-footer > .button {

.spinner {

  }
}

@media (max-width: 1240px) {
  .main-layout {
    margin: 20px 24px 0;
    grid-template-columns: 204px minmax(0, 1fr) 275px;
    gap: 17px;
  }
  .header-inner {
    margin: 0 24px;
    gap: 15px;
  }
  .brand {
    gap: 9px;
  }
  .brand img {
    width: 70px;
  }
  .brand-name {
    font-size: 16px;
  }
  .header-search {
    max-width: 240px;
  }
  .top-nav > button {
    min-width: 68px;
  }
  .top-nav > button:nth-child(3) {
    min-width: 84px;
  }
  .profile-nav > button {
    min-width: 75px;
  }
  .profile-nav {
    margin-left: 5px;
  }
  .right-sidebar > .card {
    padding: 15px;
  }
  .feed-tabs > button {
    padding: 5px 10px;
  }
  .welcome-strip > button {
    display: none;
  }
  .follow-inline {
    font-size: 10px;
  }
  .author-degree {
    display: none;
  }
  .detail-title-row h1 {
    font-size: 21px;
  }
  .detail-ctas {
    gap: 5px;
  }
  .detail-ctas .button {
    font-size: 9px;
    padding: 9px;
  }
  .flow-step strong {
    font-size: 9px;
  }
}
@media (max-width: 1050px) {
  .main-layout {
    grid-template-columns: 210px minmax(0, 1fr);
    max-width: 900px;
    margin: 20px auto;
    padding: 0 20px 40px;
    gap: 20px;
  }
  .right-sidebar {
    display: none;
  }
  .full-center .center-column {
    grid-column: 2;
  }
  .header-inner {
    gap: 18px;
  }
  .header-search {
    max-width: none;
  }
  .top-nav > button {
    min-width: 63px;
    padding-left: 6px;
    padding-right: 6px;
  }
  .top-nav > button:nth-child(3) {
    min-width: 78px;
  }
  .profile-nav > button {
    min-width: 64px;
    font-size: 9px;
  }
  .top-nav {
    margin-left: 0;
  }
  .profile-nav {
    margin-left: 0;
  }
  .brand-name small {
    font-size: 8px;
    letter-spacing: 0.5px;
  }
  .brand {
    gap: 8px;
  }
  .brand-name {
    font-size: 15px;
  }
  .brand img {
    width: 65px;
  }
  .demo-bar {
    padding: 0 24px;
  }
  .people-grid {
    grid-template-columns: 1fr 1fr;
  }
  .package-card {
    padding: 16px;
  }
  .package-card h2 {
    font-size: 14px;
  }
  .package-card-top > .status {
    font-size: 8px;
    padding: 2px 4px;
  }
  .package-card-top > .package-icon {
    width: 30px;
    height: 34px;
  }
}
@media (max-width: 780px) {
  .demo-bar {
    height: 22px;
    font-size: 8px;
    padding: 0 16px;
  }
  .demo-bar > span:last-child {
    font-size: 7px;
  }
  .site-header {
    height: 64px;
  }
  .header-inner {
    margin: 0 16px;
    gap: 15px;
  }
  .brand img {
    width: 61px;
    height: 26px;
  }
  .brand-name {
    font-size: 16px;
  }
  .brand-name small {
    font-size: 7px;
  }
  .brand-divider {
    height: 24px;
  }
  .top-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 61px;
    background: #fff;
    border-top: 1px solid var(--border);
    z-index: 50;
    justify-content: space-around;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .top-nav > button,
  .profile-nav > button {
    min-width: 0;
    flex: 1;
    font-size: 8px;
    padding: 6px 3px;
    border-bottom: 0;
    border-top: 2px solid transparent;
    gap: 1px;
  }
  .top-nav > button:nth-child(3) {
    min-width: 0;
  }
  .top-nav > button.active,
  .profile-nav > button.active {
    border-top-color: var(--green);
  }
  .profile-nav {
    border: 0;
    flex: 1;
